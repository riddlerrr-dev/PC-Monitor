[project]
name = "pc-monitor"
version = "1.0.0"
description = "Monitor a Windows PC and enforce allowed hours over SSH"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn[standard]==0.54.0",
    "paramiko==5.1.0",
    "bcrypt==5.0.0",
    "itsdangerous==2.2.0",
    "tzdata>=2025.2",  # time zone data; Windows has none built in
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2>=2.16.2",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["app/static/vendor"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, naming, comprehensions, return
# checks, blind-except and the ruff-specific rules
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "C4", "RET", "BLE", "RUF"]
ignore = [
    "RUF001",  # en-dashes and "…" in user-facing strings are deliberate
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["paramiko", "paramiko.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
