[project]
name = "pc-monitor"
version = "1.0.0"
description = "Monitor a Windows PC and enforce allowed hours over SSH"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "paramiko==5.1.0",
    "bcrypt==5.0.0",
    "itsdangerous==2.2.0",
    "tzdata>=2025.2",  # time zone data; Windows has none built in
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
